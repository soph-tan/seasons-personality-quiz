<!DOCTYPE html>
<html lang="en">

<head>
	<title>Personality Quiz</title>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- import the webpage's stylesheet -->
	<link rel="stylesheet" href="/style.css">

	<!-- import the webpage's javascript file -->
	<script src="/script.js" defer>

	</script>

  <!-- import font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>

	<header>
		<h1>Which season are you?</h1>
		<p>Answer the questions below to find out!</p>
	</header>

	<main>

		<h2>What would you like to do?</h2>
		<div class="question">

			<div class="answer-choice">
				<img src="assets/pq-book.jpg" alt="Image of an open book on a wooden table. There are also some autumn leaves on the table.">
        <br>
        <button id="q1a1">Read a book!</button>
      </div>

      <div class="answer-choice">
        <img src="assets/pq-friends.jpg" alt="Image of a group of four friends from the back, with their arms around each others’ shoulders.">
        <br>
        <button id="q1a2">Hang out with friends!</button>
      </div>

      <div class="answer-choice">
        <img src="assets/pq-movie.jpg" alt="Image of a movie theater screen, with red movie theater chairs in front of the viewer.">
        <br>
        <button id="q1a3">Watch a movie!</button>
      </div>

      <div class="answer-choice">
        <img src="assets/pq-cooking.jpg" alt="Image of a cutting board. On top of the cutting board is a bowl of shredded cheese, a knife, and cilantro. Next to the cutting board is a bowl of ground meat and a colander.">
        <br>
        <button id="q1a4">Cook a meal!</button>
      </div>
      
    </div> 
    
    <h2>Where do you want to be?</h2>
    <div class="question">

      <div class="answer-choice">
        <img src="assets/pq-home.jpg" alt="Image of a bedroom. In the center, there is a bed. Above the bed hangs three picture frames. To the right of the bed is a nightstand. To the left of the bed is a set of doors leading to a balcony.">
        <br>
        <button id="q2a1">At home!</button>
      </div>

      <div class="answer-choice">
        <img src="assets/pq-cafe.jpg" alt="Image of a woman holding a mug with a drink. There is a plate, on top of the plate is a spoon and a brown dessert.">
        <br>
        <button id="q2a2">At a cafe!</button>
      </div>

      <div class="answer-choice">
        <img src="assets/pq-library.jpg" alt="Image of a library shelf filled with books. The lighting is slightly dim, but there are lightbulbs hanging from the ceiling.">
        <br>
        <button id="q2a3">At a library!</button>
      </div>

      <div class="answer-choice">
        <img src="assets/pq-restaurant.jpg" alt="Image of an empty restaurant with lights hanging from the ceiling. There are many tables, each table has a pink cover and is surrounded by wooden chairs.">
        <br>
        <button id="q2a4">At a restaurant!</button>
      </div>
      
    </div> 
    
    <h2>What city would you like to visit?</h2>
    <div class="question">

      <div class="answer-choice">
        <img src="assets/pq-tokyo.jpg" alt="Image of a crowded pedestrian crossing in Tokyo, Japan. In the background are skyscrapers with ads and bright lights on them.">
        <br>
        <button id="q3a1">Tokyo, Japan</button>
      </div>

      <div class="answer-choice">
        <img src="assets/pq-reykjavik.jpg" alt="Aerial view of Reykjavik, Iceland. There are many homes and buildings, some painted with vibrant colors. In the background are snow capped mountains.">
        <br>
        <button id="q3a2">Reykjavik, Iceland</button>
      </div>

      <div class="answer-choice">
        <img src="assets/pq-paris.jpg" alt="Image of the Eiffel Tower in Paris, France. There is a large, green field and the viewer is surrounded by foliage.">
        <br>
        <button id="q3a3">Paris, France</button>
      </div>

      <div class="answer-choice">
        <img src="assets/pq-lisbon.jpg" alt="Image of a Lisbon cityscape. There are many white buildings with red tiled roofs.">
        <br>
        <button id="q3a4">Lisbon, Portugal</button>
      </div>

    </div> 
    
    <h2 id="result">Your result is...</h2>
    <button id="restart">Restart</button>

    
  </main>
  </body>
</html>
